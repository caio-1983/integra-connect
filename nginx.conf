server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. nginx drops server-level add_header in any location that
    # declares its own, so every location below repeats them.
    # The full CSP ships as Report-Only first: enforcing it untested could break
    # media/avatars/realtime. Only the anti-framing/anti-plugin part is enforced.

    # SPA fallback: React Router owns "/" and every client-side path (e.g. /auth,
    # /operations). Without this, nginx 404s on direct hits or refreshes of those
    # paths because no matching file exists on disk. ProtectedRoute in App.tsx is
    # what actually sends unauthenticated users from "/" to the login page.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must always be revalidated: without this the browser
        # heuristically caches it and keeps loading the previous deploy's bundle.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://*.supabase.co; form-action 'self'" always;
    }

    # Smart Pix links (/pix/{token}): one static page for every token; it fetches
    # the Pix data from GET /v1/pix/smart/{token}. Any single segment lands here,
    # so a truncated link shows "Link Pix inválido ou expirado." instead of the
    # app's login.
    location ~ "^/pix/[^/]+$" {
        try_files /pix/smart.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # Hashed Vite assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
