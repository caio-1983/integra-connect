server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns "/" and every client-side path (e.g. /auth,
    # /operations). Without this, nginx 404s on direct hits or refreshes of those
    # paths because no matching file exists on disk. ProtectedRoute in App.tsx is
    # what actually sends unauthenticated users from "/" to the login page.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must always be revalidated: without this the browser
        # heuristically caches it and keeps loading the previous deploy's bundle.
        add_header Cache-Control "no-cache" always;
    }

    # POC (link button, backend/src/routes/pocUrlButton.ts): serve the static
    # page at /pix/test itself. Through `location /` the directory lookup answers
    # with an absolute http 301 to /pix/test/. Remove with public/pix/test/.
    location = /pix/test {
        try_files /pix/test/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed Vite assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
