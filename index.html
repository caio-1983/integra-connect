<!DOCTYPE html>
<html lang="pt-BR" data-palette="oceano">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved appearance (palette + light/dark) before first paint to
      // avoid a flash. Kept in sync with themeConfigService (STORAGE_KEY / defaults).
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem('ic_theme_v1') || '{}');
          var root = document.documentElement;
          root.dataset.palette = cfg.palette || 'oceano';
          if (cfg.mode === 'dark') root.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Lumina Connect</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
  
  <meta name="description" content="Desenvolvido por Integra Solutions">

  <meta property="og:image" content="https://chat.luminaledstore.com.br/og-image.png">
  <meta name="twitter:image" content="https://chat.luminaledstore.com.br/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lumina Connect">
  <meta name="twitter:title" content="Lumina Connect">
  <meta property="og:description" content="Desenvolvido por Integra Solutions">
  <meta name="twitter:description" content="Desenvolvido por Integra Solutions">
</head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
