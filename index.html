<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#008069" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      // Apply the saved light/dark mode before first paint to avoid a flash.
      // Kept in sync with themeConfigService (STORAGE_KEY / defaults).
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem('ic_theme_v1') || '{}');
          if (cfg.mode === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Integra Connect</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
  
  <meta name="description" content="Desenvolvido por Integra Solutions">

  <meta property="og:image" content="https://chat.luminaledstore.com.br/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lumina Connect">
  <meta name="twitter:title" content="Lumina Connect">

</head>
